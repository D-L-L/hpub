kind: Environment
name: hackerspub-2050-digital
type: primary

# Shared secrets and configuration.
# Set these in Bunnyshell before deploying:
#   - hackerspub-db-password
#   - hackerspub-secret-key
#   - hackerspub-instance-actor-key
#   - AI Disclosure
environmentVariables:
  MODE: production
  ORIGIN: https://2050.digital
  API_URL: http://graphql:8080/graphql
  DB_PASSWORD: 'SECRET["hackerspub-db-password"]'
  DATABASE_URL: 'postgresql://postgres:{{ env.vars.DB_PASSWORD }}@db:5432/hackerspub'
  KV_URL: redis://redis:6379/0
  SECRET_KEY: 'SECRET["hackerspub-secret-key"]'
  INSTANCE_ACTOR_KEY: 'SECRET["hackerspub-instance-actor-key"]'
  BEHIND_PROXY: "true"
  DRIVE_DISK: fs
  FS_LOCATION: ./media
  EMAIL_FROM: admin@2050.digital
  PLAUSIBLE: "false"
  LOG_QUERY: "false"
  LOG_FEDIFY: "false"

components:
  # ------------------------------------------------------------------
  # Redis cache / KV store
  # ------------------------------------------------------------------
  - kind: Service
    name: redis
    dockerCompose:
      image: redis:8-alpine
      ports:
        - '6379:6379'

  # ------------------------------------------------------------------
  # PostgreSQL — ephemeral (no volume). Data is lost on restart.
  # ------------------------------------------------------------------
  - kind: Database
    name: db
    dockerCompose:
      image: postgres:17
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: '{{ env.vars.DB_PASSWORD }}'
        POSTGRES_DB: hackerspub
      ports:
        - '5432:5432'

  # ------------------------------------------------------------------
  # GraphQL API + ActivityPub federation backend
  # ------------------------------------------------------------------
  - kind: Application
    name: graphql
    gitRepo: 'https://github.com/YOUR_ORG/hackerspub.git'
    gitBranch: main
    gitApplicationPath: /
    dockerCompose:
      build:
        context: .
        dockerfile: Dockerfile
      command:
        - mise
        - run
        - prod:graphql
      environment:
        PORT: "8080"
      ports:
        - '8080:8080'
      healthcheck:
        test: ["CMD", "mise", "run", "prod:hc:graphql"]
        interval: 15s
        timeout: 5s
        retries: 6
        start_period: 60s
      deploy:
        resources:
          reservations:
            cpus: '0.25'
            memory: 512M
          limits:
            cpus: '1'
            memory: 1Gi
    dependsOn:
      - redis
      - db

  # ------------------------------------------------------------------
  # Background federation queue worker
  # ------------------------------------------------------------------
  - kind: Application
    name: graphql-worker
    gitRepo: 'https://github.com/D-L-L/hpub.git'
    gitBranch: main
    gitApplicationPath: /
    dockerCompose:
      build:
        context: .
        dockerfile: Dockerfile
      command:
        - mise
        - run
        - prod:graphql-worker
      environment:
        WORKER_HEALTH_FILE: /tmp/hackerspub-graphql-worker.health
      healthcheck:
        test: ["CMD", "mise", "run", "prod:hc:graphql-worker"]
        interval: 15s
        timeout: 5s
        retries: 6
        start_period: 60s
      deploy:
        resources:
          reservations:
            cpus: '0.25'
            memory: 256M
          limits:
            cpus: '0.5'
            memory: 512M
    dependsOn:
      - redis
      - db
      - graphql

  # ------------------------------------------------------------------
  # Next.js web frontend
  # ------------------------------------------------------------------
  - kind: Application
    name: web-next
    gitRepo: 'https://github.com/YOUR_ORG/hackerspub.git'
    gitBranch: main
    gitApplicationPath: /
    dockerCompose:
      build:
        context: .
        dockerfile: Dockerfile
      command:
        - mise
        - run
        - prod:web-next
      environment:
        HOST: 0.0.0.0
        API_URL: http://graphql:8080/graphql
      ports:
        - '3000:3000'
      healthcheck:
        test: ["CMD", "mise", "run", "prod:hc:web-next"]
        interval: 15s
        timeout: 5s
        retries: 6
        start_period: 60s
      deploy:
        resources:
          reservations:
            cpus: '0.25'
            memory: 512M
          limits:
            cpus: '1'
            memory: 1Gi
    dependsOn:
      - graphql

  # ------------------------------------------------------------------
  # Caddy gateway — routes ActivityPub/API paths to graphql
  # and everything else to web-next. TLS is terminated at the
  # Bunnyshell ingress; Caddy sees plain HTTP.
  # ------------------------------------------------------------------
  - kind: Service
    name: gateway
    dockerCompose:
      image: caddy:2.10-alpine
      command:
        - caddy
        - run
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      ports:
        - '8000:8000'
      deploy:
        resources:
          reservations:
            cpus: '0.1'
            memory: 128M
          limits:
            cpus: '0.25'
            memory: 256M
    files:
      /etc/caddy/Caddyfile: |
        :8000 {
            @api path /graphql /graphql/* /medium-uploads/* /media/* /.well-known/* /ap/* /nodeinfo/*

            handle @api {
                reverse_proxy graphql:8080
            }

            handle {
                reverse_proxy web-next:3000
            }
        }
    dependsOn:
      - graphql
      - web-next
    hosts:
      - hostname: '2050.digital'
        path: /
        servicePort: 8000
